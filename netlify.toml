[build]
  command = "pnpm run build:clients"
  functions = "netlify/functions"
  publish = "dist/spa"

[build.environment]
  NODE_VERSION = "20"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# Backend API is on Render. Set VITE_API_URL in Netlify env so the frontend calls it.

# Canonical host matches index.html canonical, sitemap, and robots.txt (all use www).
# Google Search Console: add a URL-prefix property for https://www.kigalisafetytraining.com/ (or a Domain
# property for kigalisafetytraining.com) so URL Inspection matches the URLs you submit. Apex-only property +
# inspecting www URLs shows "URL not in property".
[[redirects]]
  from = "/*"
  to = "https://www.kigalisafetytraining.com/:splat"
  status = 301
  force = true
  conditions = { Host = ["kigalisafetytraining.com"] }

# Proxy only static course assets (e.g. /courses/construction/file.pdf) to the backend.
# SPA routes like /, /courses, /courses/construction, /about, /contact, /terms, /privacy, /cookies,
# /register, /login, /dashboard, /admin, etc. must NOT be proxied — they are served by the fallback below.
[[redirects]]
  from = "/courses/:sector/:file"
  to = "https://ksohtc-platform.onrender.com/courses/:sector/:file"
  status = 200
  force = true

# SPA fallback: serve index.html for every path so all app routes work (direct URL, refresh, bookmark).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caching and Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache hashed assets (Vite builds) forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images and other static files
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
