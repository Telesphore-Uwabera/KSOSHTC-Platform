# Render blueprint: deploy backend API only (frontend on Netlify).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ksohtc-api
    runtime: node
    region: oregon

    buildCommand: pnpm install && pnpm run build:backend
    # Must match vite server build output (see package.json "start")
    startCommand: node dist/backend/node-build.mjs

    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
      # Set these in Render dashboard (Environment):
      # - MONGODB_URI (required; optional MONGODB_DB if not in URI path)
      # - ADMIN_EMAIL, ADMIN_PASSWORD
      # - FRONTEND_URL (your official URL, e.g. https://www.kigalisafetytraining.com for CORS)
